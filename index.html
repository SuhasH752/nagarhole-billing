<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Billing | Nagarhole Homestay</title>
    <!-- Modern Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-icon">🌿</div>
            <h1>Food Billing</h1>
            <p>Nagarhole Homestay</p>
        </div>
        
        <form id="billForm">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" placeholder="e.g., Mr. Sharma" required autocomplete="off">
                </div>
                
                <div class="input-group full-width">
                    <label for="roomNumber">Room Number</label>
                    <input type="text" id="roomNumber" placeholder="e.g., 101" required autocomplete="off">
                </div>

                <div class="input-group full-width">
                    <label for="item">Food Item</label>
                    <input type="text" id="item" placeholder="e.g., Masala Dosa" required autocomplete="off">
                </div>
                
                <div class="input-group half-width">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" value="1" min="1" required>
                </div>
                
                <div class="input-group half-width">
                    <label for="price">Price per Item (₹)</label>
                    <input type="number" id="price" placeholder="150" required>
                </div>
                
                <div class="input-group full-width">
                    <label for="workerName">Worker Name</label>
                    <input type="text" id="workerName" placeholder="Your Name" required autocomplete="off">
                </div>
            </div>

            <!-- Live Total Display -->
            <div class="total-display">
                <span>Total Amount</span>
                <span id="totalAmount">₹0</span>
            </div>
            
            <button type="submit" id="submitBtn">
                <span class="btn-text">Save Bill</span>
                <span class="spinner" id="spinner"></span>
            </button>
        </form>
        
        <div id="message" class="message"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
