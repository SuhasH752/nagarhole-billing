<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagarhole Food Billing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Food Billing</h2>
            <p>Nagarhole Homestay</p>
        </div>
        
        <form id="billForm">
            <div class="input-group">
                <label>Customer Name</label>
                <input type="text" id="customerName" placeholder="e.g., Mr. Sharma" required>
            </div>
            
            <div class="input-group">
                <label>Room Number</label>
                <input type="text" id="roomNumber" placeholder="e.g., 101" required>
            </div>

            <div class="input-group">
                <label>Food Item</label>
                <input type="text" id="item" placeholder="e.g., Masala Dosa" required>
            </div>
            
            <div class="row">
                <div class="input-group half">
                    <label>Quantity</label>
                    <input type="number" id="quantity" value="1" min="1" required>
                </div>
                <div class="input-group half">
                    <label>Price per Item (₹)</label>
                    <input type="number" id="price" placeholder="150" required>
                </div>
            </div>
            
            <div class="input-group">
                <label>Worker Name</label>
                <input type="text" id="workerName" placeholder="Your Name" required>
            </div>
            
            <button type="submit" id="submitBtn">Save Bill</button>
        </form>
        <div id="message" class="message"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
